name: Brain V2 Memory offline CI
on:
  pull_request:
    paths:
      - brain_v2_memory.py
      - test_brain_v2_memory.py
      - .github/workflows/brain_v2_memory_ci.yml
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_brain_v2_memory.py
