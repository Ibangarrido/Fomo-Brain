name: Brain V2 Replay offline CI
on:
  pull_request:
    paths:
      - 'brain_v2_*.py'
      - 'test_brain_v2_*.py'
      - .github/workflows/brain_v2_replay_ci.yml
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v -p 'test_brain_v2_*.py'
