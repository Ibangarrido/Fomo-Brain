name: V13 Meme Hunter PAPER
on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: read
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V13 unit tests
        run: python -m unittest -v test_v13_hunter.py
      - name: Restore previous paper observations
        uses: actions/cache/restore@v4
        with:
          path: v13_history.json
          key: v13-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            v13-history-${{ github.ref_name }}-
      - name: Scan public sources
        run: python v13_runner.py
      - name: Save paper observations
        uses: actions/cache/save@v4
        with:
          path: v13_history.json
          key: v13-history-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload V13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-paper-${{ github.run_id }}
          path: |
            v13_report.json
            v13_history.json
          if-no-files-found: warn
          retention-days: 7
