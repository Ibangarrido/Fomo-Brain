name: Brain Clean V1 - isolated PAPER launch

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  # Supplemental trigger when GitHub delays cron; never presented as schedule.
  workflow_run:
    workflows: ['FOMO Brain']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: brain-clean-v1-paper-ledger
  cancel-in-progress: false

jobs:
  clean_paper:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record execution provenance
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RUN_SHA"
          echo "Event=$RUN_EVENT Commit=$RUN_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest -v test_brain_clean_v1.py test_clean_v1_restore.py
      - name: Select newest completed PAPER ledger by artifact upload time
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python clean_v1_restore.py select
      - name: Download exact selected PAPER artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.restore.outputs.artifact_id }}
          run-id: ${{ steps.restore.outputs.source_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: .
      - name: Verify restored PAPER ledger provenance
        env:
          CLEAN_RESTORE_SOURCE_RUN: ${{ steps.restore.outputs.source_run }}
        run: python clean_v1_restore.py verify
      - name: Run isolated PAPER experiment
        env:
          PYTHONUNBUFFERED: '1'
        run: python brain_clean_v1.py
      - name: Upload Clean V1 state and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-clean-v1-state
          path: |
            brain_clean_v1_state.json
            brain_clean_v1_report.json
          if-no-files-found: warn
          retention-days: 30

