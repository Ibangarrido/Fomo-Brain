name: FOMO Brain

on:
  # Respaldo manual y punto de entrada para un reloj externo fiable.
  workflow_dispatch:

  # Respaldo nativo de GitHub. Puede sufrir retrasos o saltos bajo carga.
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: fomo-brain-state
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar memoria anterior
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: fomo_brain.yml
          name: fomo-memory
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Verificar simulacion V10 sin red
        run: python test_fomo_v8.py

      - name: Verificar prueba de seguimiento virtual
        run: python test_whale_paper.py

      - name: Instalar lector publico de alertas
        run: python -m pip install websocket-client==1.8.0

      - name: Ejecutar FOMO Brain
        env:
          BRAIN_CYCLES: "15"
          PYTHONUNBUFFERED: "1"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python whale_paper.py &
          whale_pid=$!
          trap 'kill -TERM "$whale_pid" 2>/dev/null || true; wait "$whale_pid" || true' EXIT
          python fomo_brain.py

      - name: Guardar memoria FOMO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fomo-memory
          path: |
            fomo_memory.json
            fomo_event_memory.json
            fomo_paper.json
            fomo_shadow_v8.json
            fomo_shadow_v9.json
            fomo_paper_v10.json
            fomo_paper_v10_impulse.json
            fomo_paper_whale.json
          if-no-files-found: ignore
          overwrite: true
