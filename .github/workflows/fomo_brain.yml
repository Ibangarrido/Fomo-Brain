name: FOMO Brain Clean V1 - PAPER

on:
  pull_request:
    paths:
      - brain_clean_v1.py
      - test_brain_clean_v1.py
      - .github/workflows/fomo_brain.yml
  workflow_dispatch:
  # GitHub only schedules workflows from the default branch.
  # This schedule starts after a reviewed merge, not on the experiment branch.
  schedule:
    - cron: "11,31,51 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: brain-clean-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean_paper:
    name: Clean V1 - ESCALERA PAPER
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline regression tests
        run: python -m unittest -v test_brain_clean_v1.py

      - name: Restore only clean V1 ledger (never legacy M4)
        if: github.event_name != 'pull_request'
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: fomo_brain.yml
          branch: ${{ github.ref_name }}
          name: brain-clean-v1-state
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Scan and update PAPER experiment
        if: github.event_name != 'pull_request'
        env:
          PYTHONUNBUFFERED: "1"
        run: python brain_clean_v1.py

      - name: Persist clean V1 ledger and report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: brain-clean-v1-state
          path: |
            brain_clean_v1_state.json
            brain_clean_v1_report.json
          if-no-files-found: warn
          retention-days: 30
