name: FOMO Brain

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *" # FOMO Brain automatico

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar memoria anterior
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: fomo_brain.yml
          name: fomo-memory
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Ejecutar FOMO Brain
        run: python fomo_brain.py

      - name: Guardar memoria FOMO
        uses: actions/upload-artifact@v4
        with:
          name: fomo-memory
          path: fomo_memory.json
          if-no-files-found: ignore
          overwrite: true
