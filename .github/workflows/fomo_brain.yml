name: FOMO Brain

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar FOMO Brain
        run: python fomo_brain.py
      - name: Guardar memoria FOMO
        uses: actions/upload-artifact@v4
        with:
          name: fomo-memory
          path: fomo_memory.json
          if-no-files-found: ignore
