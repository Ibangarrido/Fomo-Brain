name: Clean V1 ESCALERA regression tests
on:
  pull_request:
    paths:
      - brain_clean_v1.py
      - test_brain_clean_v1.py
      - .github/workflows/brain_clean_v1_tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_brain_clean_v1.py
