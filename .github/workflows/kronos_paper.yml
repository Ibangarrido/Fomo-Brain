name: Kronos PAPER experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kronos_paper.py'
      - 'test_kronos_paper.py'
      - '.github/workflows/kronos_paper.yml'
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - 'kronos_paper.py'
      - 'test_kronos_paper.py'
      - '.github/workflows/kronos_paper.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: kronos-paper-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      KRONOS_STATE_DIR: kronos-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore existing main experiment ledger
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=kronos-paper-state&per_page=100" > /tmp/kronos-artifacts.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          # Parse gh's paginated JSON stream.
          raw = Path('/tmp/kronos-artifacts.json').read_text()
          decoder, pages = json.JSONDecoder(), []
          while raw.strip():
              page, end = decoder.raw_decode(raw.lstrip())
              pages.append(page)
              raw = raw.lstrip()[end:]
          candidates = [a for p in pages for a in p['artifacts']
                        if a.get('workflow_run', {}).get('head_branch') == 'main']
          if candidates:
              latest = max(candidates, key=lambda a: a['id'])
              if latest['expired']:
                  raise SystemExit('Existing ledger expired; refusing reset')
              subprocess.run(['gh','run','download',str(latest['workflow_run']['id']),
                              '--name','kronos-paper-state','--dir','kronos-state'], check=True)
              if not Path('kronos-state/ledger.json').is_file():
                  raise SystemExit('Existing ledger missing; refusing reset')
          PY
      - name: Install isolated model dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pandas==2.2.2 numpy einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.6.2 tqdm==4.67.1
          git clone https://github.com/shiyu-coder/Kronos.git /tmp/kronos
          git -C /tmp/kronos checkout 67b630e67f6a18c9e9be918d9b4337c960db1e9a
      - name: Test evaluation invariants
        run: python -m unittest -v test_kronos_paper.py
      - name: Publish forward forecast and settle matured observations
        env:
          PYTHONPATH: /tmp/kronos
        run: python kronos_paper.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event_name == 'pull_request' && 'kronos-paper-validation' || 'kronos-paper-state' }}
          path: kronos-state/
          if-no-files-found: error
          retention-days: 90
