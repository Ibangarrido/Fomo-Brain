name: Clean V1 PR23 PAPER shadow validation
on:
  push:
    branches: [brain-clean-v1]
    paths:
      - 'brain_clean_v1.py'
      - 'test_brain_clean_v1.py'
      - '.github/workflows/brain_clean_v1_shadow.yml'
      - 'clean_v1_shadow.py'
      - 'clean_v1_restore.py'
      - 'test_clean_v1_restore.py'
      - 'test_clean_v1_shadow.py'
      - 'brain_clean_v1_paper2.py'
      - 'test_brain_clean_v1_paper2.py'
      - 'brain_clean_v1_paper2_run.py'
      - 'clean_v1_artifact_audit.py'
      - 'test_clean_v1_artifact_audit.py'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'brain_clean_v1.py'
      - 'test_brain_clean_v1.py'
      - 'clean_v1_shadow.py'
      - 'clean_v1_restore.py'
      - 'test_clean_v1_restore.py'
      - 'test_clean_v1_shadow.py'
      - 'brain_clean_v1_paper2.py'
      - 'test_brain_clean_v1_paper2.py'
      - 'brain_clean_v1_paper2_run.py'
      - 'clean_v1_artifact_audit.py'
      - 'test_clean_v1_artifact_audit.py'
      - '.github/workflows/brain_clean_v1_shadow.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: brain-clean-v1-pr23-shadow
  cancel-in-progress: false

jobs:
  shadow:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/brain-clean-v1') || (github.event_name == 'pull_request' && github.event.pull_request.number == 23 && github.event.pull_request.head.repo.full_name == 'Ibangarrido/Fomo-Brain') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/brain-clean-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head, not main or merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout SHA
        env:
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest -v test_brain_clean_v1.py test_brain_clean_v1_paper2.py test_clean_v1_shadow.py test_clean_v1_restore.py test_clean_v1_artifact_audit.py
      - name: Select latest production PAPER ledger for ephemeral shadow
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python clean_v1_restore.py select
      - name: Download exact production artifact into ephemeral runner
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.restore.outputs.artifact_id }}
          run-id: ${{ steps.restore.outputs.source_run }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: .
      - name: Verify restored PAPER ledger provenance
        env:
          CLEAN_RESTORE_SOURCE_RUN: ${{ steps.restore.outputs.source_run }}
        run: python clean_v1_restore.py verify
      - name: Verify restored ledger and preserve its actual cash
        run: python clean_v1_shadow.py preflight
      - name: Run PR code on copied PAPER ledger only
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CLEAN_SHADOW_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python brain_clean_v1.py
      - name: Verify branch provenance and compare balances
        env:
          CLEAN_SHADOW_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python clean_v1_shadow.py finalize
      - name: Upload isolated shadow audit (NEVER production artifact name)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-clean-v1-pr23-shadow
          path: |
            brain_clean_v1_shadow_baseline.json
            brain_clean_v1_shadow_comparison.json
            brain_clean_v1_report.json
          if-no-files-found: warn
          retention-days: 14
