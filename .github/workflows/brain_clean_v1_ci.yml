name: Clean V1 runtime regression tests
on:
  pull_request:
    paths:
      - 'brain_clean_v1.py'
      - 'test_brain_clean_v1.py'
      - 'brain_clean_v1_paper2.py'
      - 'test_brain_clean_v1_paper2.py'
      - 'brain_clean_v1_paper2_seed.json'
      - 'clean_v1_restore.py'
      - 'test_clean_v1_restore.py'
      - 'clean_v1_shadow.py'
      - 'test_clean_v1_shadow.py'
      - 'clean_v1_artifact_audit.py'
      - 'test_clean_v1_artifact_audit.py'
      - '.github/workflows/brain_clean_v1_ci.yml'
      - '.github/workflows/brain_clean_v1*.yml'
  push:
    branches: [main, brain-clean-v1]
    paths:
      - 'brain_clean_v1.py'
      - 'test_brain_clean_v1.py'
      - 'brain_clean_v1_paper2.py'
      - 'test_brain_clean_v1_paper2.py'
      - 'brain_clean_v1_paper2_seed.json'
      - 'clean_v1_restore.py'
      - 'test_clean_v1_restore.py'
      - 'clean_v1_shadow.py'
      - 'test_clean_v1_shadow.py'
      - 'clean_v1_artifact_audit.py'
      - 'test_clean_v1_artifact_audit.py'
      - '.github/workflows/brain_clean_v1_ci.yml'
      - '.github/workflows/brain_clean_v1*.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_brain_clean_v1.py test_brain_clean_v1_paper2.py test_clean_v1_restore.py test_clean_v1_shadow.py test_clean_v1_artifact_audit.py
